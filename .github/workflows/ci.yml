name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-lint:
    name: Code Formatting & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra all --extra dev

      - name: Check code formatting (Ruff)
        run: uv run ruff format --check src/ tests/ examples/

      - name: Check code linting (Ruff)
        run: uv run ruff check src/ tests/ examples/

  type-check:
    name: Static Type Analysis (MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra all --extra dev

      - name: Run MyPy static type checks
        run: uv run mypy src/

  test-matrix:
    name: Tests (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [format-and-lint, type-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra all --extra dev

      - name: Run unit and integration tests with coverage
        run: |
          uv run pytest \
            --cov=runtimeverify \
            --cov-report=term-missing \
            --cov-report=xml \
            tests/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  security-audit:
    name: Security Tests & Vulnerability Audit
    needs: [format-and-lint, type-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra all --extra dev

      - name: Run security hardening tests
        run: uv run pytest tests/test_security_hardening.py -v

      - name: Run security benchmark evaluation tests
        run: uv run pytest tests/test_security_benchmark.py -v

      - name: Run pip-audit for dependency vulnerabilities
        run: uv run pip-audit

  package-check:
    name: Package Build & Validation
    needs: [test-matrix, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install build tools
        run: uv sync --extra dev

      - name: Build distribution packages (wheel + sdist)
        run: uv build

      - name: Validate distribution packages with Twine
        run: uv run twine check --strict dist/*

      - name: Test clean virtual environment installation
        run: |
          python -m venv test_env
          ./test_env/bin/pip install $(ls dist/runtimeverify-*.whl | head -n 1)
          ./test_env/bin/runtimeverify version
          ./test_env/bin/runtimeverify check --command "git status"
          ./test_env/bin/runtimeverify check --command "rm -rf /" || true
