version: "v2"
name: "policy-v2"
description: "Hardened policy ruleset (v2) - Adds early pre-emptive internal credential store blocking"
conflict_resolution: "most_restrictive"
default_decision: "ALLOW"
default_severity: "INFO"

policies:
  - id: "deny-application-credentials"
    name: "Block Application Credential Stores"
    description: "Pre-emptively blocks access to local or application credential and secret files"
    enabled: true
    decision: "BLOCK"
    severity: "CRITICAL"
    priority: 105
    match:
      path:
        glob: "config/credentials*"
    reason: "Pre-emptive block: Access to application credential files is strictly prohibited."

  - id: "deny-ssh-keys"
    name: "Block SSH Private Keys"
    enabled: true
    decision: "BLOCK"
    severity: "CRITICAL"
    priority: 100
    match:
      path:
        glob: "~/.ssh/*"
    reason: "Access to private SSH keys is prohibited."

  - id: "deny-aws-credentials"
    name: "Block AWS Credentials"
    enabled: true
    decision: "BLOCK"
    severity: "CRITICAL"
    priority: 100
    match:
      path:
        glob: "~/.aws/*"
    reason: "Access to cloud credentials is prohibited."

  - id: "deny-env-files"
    name: "Block Environment Secret Files"
    enabled: true
    decision: "BLOCK"
    severity: "HIGH"
    priority: 90
    match:
      path:
        glob: ".env*"
    reason: "Direct access to environment secrets is blocked."

  - id: "block-destructive-rm"
    name: "Block Destructive File Deletions"
    enabled: true
    decision: "BLOCK"
    severity: "CRITICAL"
    priority: 95
    match:
      command:
        destructive: true
    reason: "Destructive shell commands are prohibited."

  - id: "deny-untrusted-network-exfil"
    name: "Block Untrusted Outbound Network"
    enabled: true
    decision: "BLOCK"
    severity: "CRITICAL"
    priority: 85
    match:
      network:
        url:
          contains: "pastebin.com"
    reason: "Outbound network exfiltration to untrusted domains is blocked."
