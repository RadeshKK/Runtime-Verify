[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runtimeverify"
version = "0.1.0"
description = "Vendor-neutral statistical runtime verification, deterministic policy governance, and behavioral security platform for autonomous AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "RuntimeVerify Contributors", email = "maintainers@runtimeverify.dev" }
]
maintainers = [
    { name = "RuntimeVerify Maintainers", email = "security@runtimeverify.dev" }
]
keywords = [
    "ai-agents",
    "security",
    "runtime-verification",
    "guardrails",
    "behavioral-analysis",
    "sprt",
    "markov-models",
    "policy-engine",
    "audit",
    "autonomous-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Lightweight base dependencies - No heavyweight ML or server frameworks required
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "scipy>=1.10.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
laya = [
    "laya>=0.1.0",
]
dev = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.28.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.4.0",
    "ruff>=0.4.0",
]
all = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "laya>=0.1.0",
]

[project.scripts]
runtimeverify = "runtimeverify.cli:main"
verify = "runtimeverify.cli:main"

[project.urls]
Homepage = "https://github.com/RadeshKK/Runtime-Verify"
Documentation = "https://github.com/RadeshKK/Runtime-Verify/tree/master/docs"
Repository = "https://github.com/RadeshKK/Runtime-Verify"
Issues = "https://github.com/RadeshKK/Runtime-Verify/issues"
Changelog = "https://github.com/RadeshKK/Runtime-Verify/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runtimeverify = [
    "dashboard/*.html",
    "dashboard/*.js",
    "dashboard/*.css",
    "**/*.yaml",
    "**/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pip-audit>=2.10.1",
    "twine>=7.0.0",
]
